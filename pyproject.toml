[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-soc-benchmark"
version = "1.1.0"
authors = [
  { name="Artemis Team", email="help@artemis.ai" },
]
description = "A high-fidelity SOC analyst triage benchmark for evaluating autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.3",
    "requests>=2.31.0",
    "openai>=1.30.0,<2.0.0",
    "httpx>=0.24.0,<0.28.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "openenv-core",
]

[project.scripts]
server = "server.app:main"

[project.urls]
Homepage = "https://github.com/MONSTER4REX/ARTEMIS"
"Bug Tracker" = "https://github.com/MONSTER4REX/ARTEMIS/issues"
